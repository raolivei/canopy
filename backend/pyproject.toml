[project]
name = "canopy-backend"
version = "1.0.0"
description = "Canopy - Self-hosted personal finance, investment, and budgeting dashboard."
readme = "../README.md"
requires-python = ">=3.11"
# Keep in step with requirements.txt (the install path used by Docker and CI).
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
# Mirrors requirements-dev.txt.
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
# Resolve ``from backend.x import ...`` when pytest is invoked either
# from the repo root or from ``backend/``.
pythonpath = [".", ".."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
# Standalone config (the shared workspace-config ruff.toml is not checked out
# alongside this repo). Mirrors the raolivei Python baseline.
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions", "venv", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: long literals handled per-file; B008: FastAPI Depends/Query defaults;
# B007/E722: legacy patterns to tighten separately; UP042: str-Enum mixins are
# intentional for Pydantic/SQLAlchemy compatibility.
ignore = ["E501", "B008", "B007", "E722", "UP042"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Long regex strings and literal CSV rows must stay on one line.
"services/wealthsimple/description_parser.py" = ["E501"]
"tests/test_wealthsimple_importer.py" = ["E501"]
"tests/test_portfolio_review_parser.py" = ["E501"]
"scripts/seed_portfolio.py" = ["E501"]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

