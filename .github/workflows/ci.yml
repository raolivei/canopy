name: CI

# Quality gate for every pull request and for main, built from the shared
# reusable workflows in raolivei/github-workflows. Image builds live in
# build-and-push.yml and the VERSION bump check in pr.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend
    uses: raolivei/github-workflows/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.11"
      working-directory: backend
      package-manager: pip
      run-ruff: true
      run-ruff-format: true
      run-mypy: false
      run-pytest: true
      pytest-args: -q
      runs-on: ubuntu-latest

  frontend:
    name: Frontend
    uses: raolivei/github-workflows/.github/workflows/node-ci.yml@main
    with:
      node-version: "20"
      working-directory: frontend
      install-args: --legacy-peer-deps
      runs-on: ubuntu-latest

  migrations:
    name: Migrations / postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy-ci
          POSTGRES_DB: canopy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canopy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://canopy:canopy-ci@localhost:5432/canopy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Upgrade an empty database twice at once, then check the schema
        run: backend/scripts/check_postgres_migrations.sh
